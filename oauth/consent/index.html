<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabernacle access</title>
<!-- OAuth 2.1 consent page for Supabase Auth's OAuth server (docs/mcp-design.md, section 3).
     Supabase redirects here (Site URL + /oauth/consent) with ?authorization_id=... when a client such as Claude asks
     to connect. The page signs the user in with Google, shows who is asking and for what, and approves or denies.
     It holds no secrets: only the project URL and the publishable (anon) key, which are public by design. -->
<style>
  :root { --bg: #f7f5f0; --fg: #1d1b16; --muted: #6b665c; --card: #fff; --line: #e4dfd4; --accent: #2f5d50; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15140f; --fg: #ece8de; --muted: #a39d90; --card: #1f1d17; --line: #34312a; --accent: #7fb8a6; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 10vh auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 8px 0; } .muted { color: var(--muted); font-size: 14px; }
  ul { padding-left: 20px; margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main><div class="card" id="card"><p class="muted">Loading…</p></div></main>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.1/+esm";

  // Public values for project tabernacle. Publishable key is public by design.
  const SUPABASE_URL = "https://chukairvfkejskoudhsv.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_bHYrwid2mIkkR29qKMx54w__dDPT-ms";

  const sb = createClient(SUPABASE_URL, PUBLISHABLE_KEY);
  const card = document.getElementById("card");
  const params = new URLSearchParams(location.search);
  const authorizationId = params.get("authorization_id");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const show = (html) => { card.innerHTML = html; };

  async function main() {
    if (!authorizationId) return show(`<h1>Tabernacle</h1><p class="muted">Nothing to approve here.</p>`);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      show(`<h1>Sign in to continue</h1><p class="muted">An app is asking to connect to Tabernacle.</p>
            <div class="row"><button class="primary" id="google">Continue with Google</button></div>`);
      document.getElementById("google").onclick = () =>
        sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href } });
      return;
    }
    const { data, error } = await sb.auth.oauth.getAuthorizationDetails(authorizationId);
    // Requests expire after about ten minutes (seen as an error or a missing request).
    if (error || !data) return expired();
    // Already approved earlier: Supabase hands back the redirect straight away.
    if (data.redirect_url) { location.href = data.redirect_url; return; }
    const client = data.client?.name || "An app";
    const scopes = (data.scope || "").split(" ").filter(Boolean);
    show(`<h1>${esc(client)} wants to use Tabernacle</h1>
          <p>Signed in as <b>${esc(session.user.email)}</b>.</p>
          <p class="muted">It will be able to read and propose changes to what your Tabernacle tier allows.
             Access is checked on every request and can be revoked.</p>
          ${scopes.length ? `<ul>${scopes.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
          <div class="row"><button id="deny">Deny</button><button class="primary" id="allow">Allow</button></div>`);
    const decide = async (approve) => {
      document.querySelectorAll("button").forEach((b) => (b.disabled = true));
      const fn = approve ? sb.auth.oauth.approveAuthorization : sb.auth.oauth.denyAuthorization;
      const { data: out, error: err } = await fn.call(sb.auth.oauth, authorizationId, { skipBrowserRedirect: true });
      if (err?.code === "oauth_authorization_not_found") return expired();
      if (err) return show(`<h1>Something went wrong</h1><p class="muted">${esc(err.message)}</p>`);
      if (out?.redirect_url) location.href = out.redirect_url;
      else show(`<h1>Done</h1><p class="muted">You can close this tab.</p>`);
    };
    document.getElementById("allow").onclick = () => decide(true);
    document.getElementById("deny").onclick = () => decide(false);
  }
  function expired() {
    show(`<h1>This request has expired</h1>
          <p class="muted">Connection requests are only valid for a few minutes. Go back to Claude and connect again.</p>`);
  }
  main().catch((e) => show(`<h1>Something went wrong</h1><p class="muted">${esc(e.message)}</p>`));
</script>
</body>
</html>
